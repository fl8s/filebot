name: Build and Test

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ant ivy openjfx libopenjfx-java libopenjfx-jni libmediainfo-dev libchromaprint-tools
        sudo ln -s /usr/share/java/ivy.jar /usr/share/ant/lib/ivy.jar || true

    - name: Build FileBot
      run: |
        export JAVA_HOME=${JAVA_HOME_11_X64}
        export CLASSPATH="/usr/share/openjfx/lib/*"
        ant resolve
        ant fatjar

    - name: Run E2E Tests
      run: |
        chmod +x test_e2e.sh
        ./test_e2e.sh

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: filebot-jar
        path: dist/FileBot_*.jar

  docker:
    runs-on: ubuntu-22.04
    needs: build
    permissions:
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') }}
        tags: ghcr.io/${{ github.repository }}:latest

  release:
    runs-on: ubuntu-22.04
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    permissions:
      contents: write

    steps:
    - name: Download Artifact
      uses: actions/download-artifact@v4
      with:
        name: filebot-jar
        path: dist/

    - name: Delete old release
      uses: dev-drprasad/delete-tag-and-release@v0.2.1
      with:
        delete_release: true
        tag_name: latest
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: dist/FileBot_*.jar
        tag_name: latest
        name: Latest Build
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
