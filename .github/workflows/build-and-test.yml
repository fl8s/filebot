name: Build and Test

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Java 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ant ivy openjfx libopenjfx-java libopenjfx-jni libmediainfo-dev libchromaprint-tools
        sudo ln -s /usr/share/java/ivy.jar /usr/share/ant/lib/ivy.jar || true

    - name: Build FileBot
      run: |
        export JAVA_HOME=${JAVA_HOME_11_X64}
        export CLASSPATH="/usr/share/openjfx/lib/*"
        ant resolve
        ant fatjar

    - name: Run E2E Tests
      run: |
        chmod +x test_e2e.sh
        ./test_e2e.sh
